<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <section class="login-screen" aria-labelledby="loginTitle">
      <form class="login-panel" method="post" action="{{ url_for('auth.login') }}">
        <div class="brand login-brand">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="8" y="8" width="16" height="16" rx="3" />
            <rect x="28" y="8" width="16" height="16" rx="3" />
            <rect x="48" y="8" width="8" height="16" rx="3" />
            <rect x="8" y="28" width="16" height="16" rx="3" />
            <rect x="28" y="28" width="16" height="16" rx="3" />
            <rect x="48" y="28" width="8" height="16" rx="3" />
            <rect x="8" y="48" width="16" height="8" rx="3" />
            <rect x="28" y="48" width="16" height="8" rx="3" />
            <rect x="48" y="48" width="8" height="8" rx="3" />
          </svg>
          <div>
            <h1 id="loginTitle">Wordle Login</h1>
          </div>
        </div>

        <label class="field">
          <span>Username</span>
          <input name="username" type="text" autocomplete="username" required />
        </label>

        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>

        <button class="primary-action" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <path d="M10 17l5-5-5-5" />
            <path d="M15 12H3" />
          </svg>
          <span>Sign In</span>
        </button>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <p class="login-message">{{ messages[0] }}</p>
          {% else %}
            <p class="login-message"></p>
          {% endif %}
        {% endwith %}

        <a class="subtle-link" href="{{ url_for('auth.register') }}">Create a player account</a>
      </form>
    </section>
  </body>
</html>
